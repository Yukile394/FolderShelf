name: Android CI - APK Derleme

# Her push ve pull request'te calisir; ayrica Actions sekmesinden
# manuel olarak da tetiklenebilir (workflow_dispatch).
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Debug ve Release APK derle
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir (checkout)
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur (sistem Gradle - wrapper'i olusturmak icin)
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper olustur/dogrula
        # Bu depoda gradle-wrapper.jar (ikili dosya) bilerek YOK, cunku
        # bu proje bir sohbet arayuzunde olusturuldu ve ikili dosya
        # yazilamiyor. Burada, CI'da onceden kurulu olan Gradle'i
        # kullanarak wrapper'i (jar dahil) otomatik olarak yeniden
        # olustururuz. Boylece "./gradlew" her zaman calisir.
        run: |
          gradle wrapper --gradle-version 9.5.1
          chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: Imzalama anahtarini coz (Secrets tanimliysa)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"

      - name: Release APK derle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Debug APK'yi Artifacts'e yukle
        uses: actions/upload-artifact@v4
        with:
          name: FolderShelf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK'yi Artifacts'e yukle
        uses: actions/upload-artifact@v4
        with:
          name: FolderShelf-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
